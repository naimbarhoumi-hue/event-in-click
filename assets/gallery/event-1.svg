<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E8C96A"/><stop offset="100%" stop-color="#9A7B2E"/></linearGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#E8C96A" stop-opacity="0.35"/><stop offset="100%" stop-color="#E8C96A" stop-opacity="0"/></radialGradient>
